workflows:
  ios-testflight:
    name: Linka iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: linka_ios_asc_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.linka.app
      node: 20.18.0
      groups:
        - linka_env
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Generate native iOS project (Expo prebuild)
        script: npx expo prebuild --platform ios --no-install
      - name: Detect generated Xcode workspace/scheme names
        script: |
          # Windows 上跑不了 `expo prebuild --platform ios`（見對話紀錄），沒辦法在本機先確認
          # Expo 產生的 .xcworkspace/scheme 實際命名，寧可讓 CI 動態偵測，不要猜一個可能是錯的
          # 硬編碼值（例如照 app.json 的 name "Linka" 還是 slug "linka-ios" 命名，行為可能因
          # Expo SDK 版本而異）。
          WORKSPACE_PATH=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "找不到 .xcworkspace，prebuild 可能失敗，檢查上一步的 log"
            exit 1
          fi
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          echo "偵測到 workspace: $WORKSPACE_PATH，scheme: $SCHEME_NAME"
          echo "XCODE_WORKSPACE=$WORKSPACE_PATH" >> $CM_ENV
          echo "XCODE_SCHEME=$SCHEME_NAME" >> $CM_ENV
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
